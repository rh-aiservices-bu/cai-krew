apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: auth-ui
  namespace: {{ .Values.namespace }}
  labels:
    app: auth-ui
spec:
  host: {{ .Values.routeHost }}
  to:
    kind: Service
    name: auth-ui
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
