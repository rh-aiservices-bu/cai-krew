{{- if .Values.userTokenRefresher.enabled }}
---
# Secret: Keycloak config for refreshing user tokens via refresh_token grant.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.agent.name }}-user-token-refresher
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: {{ .Values.agent.name }}
type: Opaque
stringData:
  keycloak-token-url: {{ .Values.userTokenRefresher.keycloakTokenUrl | quote }}
  client-id: {{ .Values.userTokenRefresher.clientId | quote }}
  client-secret: {{ .Values.userTokenRefresher.clientSecret | quote }}
---
# ServiceAccount for the CronJob pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agent.name }}-user-token-refresher
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: {{ .Values.agent.name }}
---
# Role: exec into the Hermes pod to run the refresh script on the PVC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.agent.name }}-user-token-refresher
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: {{ .Values.agent.name }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.agent.name }}-user-token-refresher
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: {{ .Values.agent.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.agent.name }}-user-token-refresher
subjects:
- kind: ServiceAccount
  name: {{ .Values.agent.name }}-user-token-refresher
  namespace: {{ .Values.agent.namespace }}
---
# ConfigMap: shell wrapper + Python script run by the CronJob.
# Two separate keys so the Python is not embedded as a heredoc inside the
# shell (which breaks YAML parsers). The shell passes credentials as env
# vars and pipes refresh.py into the pod via stdin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agent.name }}-user-token-refresher-script
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: {{ .Values.agent.name }}
data:
  refresh.sh: |
    #!/bin/bash
    set -euo pipefail

    NAMESPACE="{{ .Values.agent.namespace }}"
    AGENT_NAME="{{ .Values.agent.name }}"

    KEYCLOAK_TOKEN_URL=$(cat /credentials/keycloak-token-url)
    CLIENT_ID=$(cat /credentials/client-id)
    CLIENT_SECRET=$(cat /credentials/client-secret)

    HERMES_POD=$(oc get pod \
      -n "$NAMESPACE" \
      -l "app=$AGENT_NAME" \
      --field-selector=status.phase=Running \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

    if [ -z "$HERMES_POD" ]; then
      echo "ERROR: No running Hermes pod found (app=$AGENT_NAME in $NAMESPACE)"
      exit 1
    fi

    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Refreshing user tokens on pod: $HERMES_POD"

    oc exec -i -n "$NAMESPACE" "$HERMES_POD" -c hermes-agent -- /bin/sh -c "
      export KEYCLOAK_URL='$KEYCLOAK_TOKEN_URL'
      export MCP_CLIENT_ID='$CLIENT_ID'
      export MCP_CLIENT_SECRET='$CLIENT_SECRET'
      python3 -
    " < /scripts/refresh.py

    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Done."

  refresh.py: |
    import glob, json, os, ssl, stat, sys, time, urllib.parse, urllib.request

    KEYCLOAK_URL  = os.environ["KEYCLOAK_URL"]
    CLIENT_ID     = os.environ["MCP_CLIENT_ID"]
    CLIENT_SECRET = os.environ["MCP_CLIENT_SECRET"]

    hermes_home = os.environ.get("HERMES_HOME", "/app/.hermes")
    pattern     = os.path.join(hermes_home, "user-tokens", "*", "gateway.json")
    token_files = glob.glob(pattern)

    if not token_files:
        print("No user token files found, nothing to refresh.")
        sys.exit(0)

    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode    = ssl.CERT_NONE


    def atomic_write(path, data):
        tmp = path + ".tmp"
        fd  = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o644)
        try:
            with os.fdopen(fd, "w") as f:
                json.dump(data, f, indent=2)
        except Exception:
            try:
                os.unlink(tmp)
            except OSError:
                pass
            raise
        os.replace(tmp, path)


    ok = expired = failed = 0

    for token_path in token_files:
        slack_user = os.path.basename(os.path.dirname(token_path))
        try:
            data = json.loads(open(token_path).read())
        except Exception as exc:
            print("  SKIP {}: unreadable token file: {}".format(slack_user, exc))
            failed += 1
            continue

        refresh_token = data.get("refresh_token")
        if not refresh_token:
            print("  SKIP {}: no refresh_token in file".format(slack_user))
            failed += 1
            continue

        payload = urllib.parse.urlencode({
            "grant_type":    "refresh_token",
            "client_id":     CLIENT_ID,
            "client_secret": CLIENT_SECRET,
            "refresh_token": refresh_token,
        }).encode()

        req = urllib.request.Request(KEYCLOAK_URL, data=payload, method="POST")
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=15) as r:
                resp = json.loads(r.read())
        except Exception as exc:
            print("  FAIL {}: Keycloak request error: {}".format(slack_user, exc))
            failed += 1
            continue

        if "access_token" not in resp:
            print("  EXPIRED {}: refresh rejected: {}".format(slack_user, resp.get("error", resp)))
            data["expires_at"] = 0
            try:
                atomic_write(token_path, data)
            except Exception as exc:
                print("    WARNING: could not mark expired: {}".format(exc))
            expired += 1
            continue

        expires_in = resp.get("expires_in", 300)
        new_data = {
            "access_token":  resp["access_token"],
            "token_type":    resp.get("token_type", "bearer"),
            "expires_in":    expires_in,
            "expires_at":    time.time() + expires_in,
            "slack_user_id": slack_user,
        }
        new_data["refresh_token"] = resp.get("refresh_token", refresh_token)

        try:
            atomic_write(token_path, new_data)
            print("  OK {}: refreshed, expires_in={}s ({}min)".format(
                slack_user, expires_in, expires_in // 60))
            ok += 1
        except Exception as exc:
            print("  FAIL {}: could not write token: {}".format(slack_user, exc))
            failed += 1

    print("Done -- ok={} expired={} failed={}".format(ok, expired, failed))
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.agent.name }}-user-token-refresher
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: {{ .Values.agent.name }}
spec:
  schedule: {{ .Values.userTokenRefresher.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: {{ .Values.agent.name }}-user-token-refresher
        spec:
          serviceAccountName: {{ .Values.agent.name }}-user-token-refresher
          restartPolicy: OnFailure
          containers:
          - name: refresher
            image: {{ .Values.userTokenRefresher.image | quote }}
            imagePullPolicy: Always
            command: ["/bin/bash", "/scripts/refresh.sh"]
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
          volumes:
          - name: scripts
            configMap:
              name: {{ .Values.agent.name }}-user-token-refresher-script
              defaultMode: 0755
          - name: credentials
            secret:
              secretName: {{ .Values.agent.name }}-user-token-refresher
{{- end }}
