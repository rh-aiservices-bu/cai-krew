apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-gateway-route-authz-policy
  namespace: mcp-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp-gateway-route
  rules:
    authentication:
      anonymous:
        anonymous: {}
        when:
        - predicate: '!request.headers.exists(h, h == ''x-mcp-toolname'')'
      keycloak:
        jwt:
          issuerUrl: https://sso.apps.cluster-86gng.dyn.redhatworkshops.io/realms/mcp
        when:
        - predicate: request.headers.exists(h, h == 'x-mcp-toolname')
    authorization:
      tool-access-check:
        patternMatching:
          patterns:
          - predicate: |
              ('tool:' + request.headers['x-mcp-toolname']) in (has(auth.identity.resource_access) && auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername']) ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles : [])
        when:
        - predicate: request.headers.exists(h, h == 'x-mcp-toolname')
    response:
      unauthorized:
        body:
          value: |
            {
              "error": "Forbidden",
              "message": "MCP Tool Access denied: Insufficient permissions for this tool."
            }
