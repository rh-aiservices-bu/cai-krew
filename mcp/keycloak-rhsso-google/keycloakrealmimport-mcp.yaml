apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: mcp
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm:
    realm: mcp
    id: mcp
    enabled: true
    sslRequired: none
    registrationAllowed: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: false
    editUsernameAllowed: false
    bruteForceProtected: true
    accessTokenLifespan: 1800
    ssoSessionMaxLifespan: 1800
    identityProviders:
      - alias: google
        displayName: Google
        providerId: google
        enabled: true
        trustEmail: true
        storeToken: false
        addReadTokenRoleOnCreate: false
        linkOnly: false
        firstBrokerLoginFlowAlias: auto-link-broker
        config:
          clientId: "${GOOGLE_CLIENT_ID}"
          clientSecret: "${GOOGLE_CLIENT_SECRET}"
          hostedDomain: example.com
          useUserIpParam: "false"
          offlineAccess: "false"
          syncMode: LEGACY
    authenticationFlows:
      - alias: auto-link-broker
        description: Auto-links broker accounts by email without password verification. Required when SMTP is not configured.
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - authenticator: idp-detect-existing-broker-user
            authenticatorFlow: false
            requirement: REQUIRED
            priority: 0
          - authenticator: idp-auto-link
            authenticatorFlow: false
            requirement: REQUIRED
            priority: 1
    roles:
      realm:
        - name: mcp-user
          description: Basic MCP user role
    groups:
      - name: mcp-users
        subGroups: []
    defaultGroups:
      - mcp-users
    clients:
      - clientId: mcp-gateway
        name: MCP Gateway Client
        enabled: true
        publicClient: true
        directAccessGrantsEnabled: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        redirectUris:
          - "http://localhost:*"
          - "http://127.0.0.1:*"
          - "https://localhost:*"
        webOrigins:
          - "*"
        protocol: openid-connect
        attributes:
          pkce.code.challenge.method: S256
          client.secret.creation.time: "0"
        defaultClientScopes:
          - openid
          - roles
          - groups
      - clientId: mcp-test/test-server1
        name: Test Server 1 Resource
        enabled: true
        bearerOnly: true
        publicClient: false
        serviceAccountsEnabled: false
        protocol: openid-connect
        defaultClientScopes:
          - openid
    clientScopes:
      - name: groups
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            consentRequired: false
            config:
              full.path: "false"
              introspection.token.claim: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: groups
      - name: roles
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: resource_access
            protocol: openid-connect
            protocolMapper: oidc-usermodel-client-role-mapper
            consentRequired: false
            config:
              multivalued: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: "resource_access.${client_id}.roles"
              jsonType.label: String
    users:
      - username: testuser
        email: testuser@example.com
        firstName: Test
        lastName: User
        enabled: true
        emailVerified: true
        credentials:
          - type: password
            value: testuser
            temporary: false
        realmRoles:
          - mcp-user
        groups:
          - mcp-users
        clientRoles:
          mcp-test/test-server1:
            - "tool:greet"
            - "tool:headers"
            - "tool:time"
    clientScopeMappings:
      mcp-test/test-server1:
        - client: mcp-gateway
          roles:
            - "tool:greet"
            - "tool:headers"
            - "tool:time"
