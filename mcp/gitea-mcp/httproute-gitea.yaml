apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-mcp-server-route
  namespace: mcp-test
  labels:
    mcp-server: "true"
spec:
  parentRefs:
    - name: mcp-gateway
      namespace: mcp-gateway
      sectionName: mcps
  hostnames:
    - "gitea-mcp-server.mcp.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitea-mcp-server
          port: 8080
      # No Authorization filter here — Authorino (gitea-mcp-authz-policy) replaces
      # the Keycloak JWT with the user's Gitea PAT (token <pat>) before forwarding.
      # If a user has no gitea_pat attribute set, no header is injected and
      # gitea-mcp-server falls back to GITEA_ACCESS_TOKEN.
