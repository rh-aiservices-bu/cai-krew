apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlassian-mcp-server-route
  namespace: mcp-test
  labels:
    mcp-server: "true"
spec:
  parentRefs:
  - name: mcp-gateway
    namespace: mcp-gateway
  hostnames:
  - atlassian.mcp.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/mcp
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: mcp.atlassian.com
    backendRefs:
    - name: mcp.atlassian.com
      kind: Hostname
      group: networking.istio.io
      port: 443
